name: Operational Spine

on:
  pull_request:
    paths:
      - 'packages/operational-spine/**'
      - 'packages/bridge-session/src/continuity-replay-proof.mjs'
      - 'docs/PROJECT_ZERO_OPERATIONAL_SPINE_V1.md'
      - 'docs/release-evidence/**'
      - 'package.json'
      - '.github/workflows/operational-spine.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/operational-spine/**'
      - 'packages/bridge-session/src/continuity-replay-proof.mjs'
      - 'docs/PROJECT_ZERO_OPERATIONAL_SPINE_V1.md'
      - 'docs/release-evidence/**'
      - 'package.json'
      - '.github/workflows/operational-spine.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Node 24 contracts and proving chamber
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check operational spine syntax
        run: npm run operational:check

      - name: Run operational spine tests
        run: npm run operational:test

      - name: Generate bound release evidence
        env:
          HEARTHFIRE_RELEASE_ID: operational-spine-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm run operational:evidence

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: hearthfire-release-evidence
          path: release-evidence/hearthfire-operational-spine-v1.json
          if-no-files-found: error
          retention-days: 30
