name: STARWELL Server Verify

on:
  push:
    branches:
      - main
    paths:
      - 'starwell-server/**'
      - 'scripts/verify-node-runtime.mjs'
      - 'package.json'
      - '.nvmrc'
      - '.node-version'
      - '.npmrc'
      - '.github/workflows/starwell-server.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'starwell-server/**'
      - 'scripts/verify-node-runtime.mjs'
      - 'package.json'
      - '.nvmrc'
      - '.node-version'
      - '.npmrc'
      - '.github/workflows/starwell-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify place
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Hearthfire
        uses: actions/checkout@v5

      - name: Resolve pinned Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Show runtime
        run: node --version

      - name: Verify Node runtime contract
        run: npm run node:verify

      - name: Check STARWELL and bridge syntax
        run: npm run starwell:check

      - name: Test place, REI Mythience, and bridge contracts
        run: npm run starwell:test
