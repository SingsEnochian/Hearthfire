name: Bridge Session

on:
  pull_request:
    paths:
      - 'packages/bridge-session/**'
      - 'package.json'
      - '.github/workflows/bridge-session.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/bridge-session/**'
      - 'package.json'
      - '.github/workflows/bridge-session.yml'

permissions:
  contents: read

jobs:
  vertical-slice:
    name: Node 24 crossing, lamination, and review room
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Report runtime
        run: node --version

      - name: Syntax check
        run: |
          node --check packages/bridge-session/src/bridge-session.mjs
          node --check packages/bridge-session/src/lamination-engine.mjs
          node --check packages/bridge-session/src/bridge-lamination.mjs
          node --check packages/bridge-session/src/lamination-review.mjs
          node --check packages/bridge-session/cli.mjs
          node --check packages/bridge-session/lamination-cli.mjs
          node --check packages/bridge-session/review-room-server.mjs
          node --check packages/bridge-session/review-room/review-room.js

      - name: Run bridge, lamination, and review tests
        run: node --test packages/bridge-session/test/*.test.mjs

      - name: Run standalone bridge health check
        run: node packages/bridge-session/cli.mjs health --data "$RUNNER_TEMP/bridge-health"

      - name: Run first complete crossing
        run: node packages/bridge-session/cli.mjs demo --world terra-aeterna --data "$RUNNER_TEMP/bridge-demo"

      - name: Run standalone lamination health check
        run: node packages/bridge-session/lamination-cli.mjs health --data "$RUNNER_TEMP/lamination-health"

      - name: Run crossing with durable laminate
        run: node packages/bridge-session/lamination-cli.mjs demo --world terra-aeterna --data "$RUNNER_TEMP/lamination-demo"

      - name: Read latest laminate
        run: node packages/bridge-session/lamination-cli.mjs latest --data "$RUNNER_TEMP/lamination-demo"

      - name: Run standalone Review Room health check
        run: node packages/bridge-session/review-room-server.mjs health --data "$RUNNER_TEMP/lamination-demo"

      - name: Smoke-test Review Room HTTP surface
        run: |
          node packages/bridge-session/review-room-server.mjs serve --data "$RUNNER_TEMP/lamination-demo" --port 4319 &
          REVIEW_PID=$!
          trap 'kill $REVIEW_PID 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:4319/health
          curl --fail --silent http://127.0.0.1:4319/api/lamination/latest
          curl --fail --silent http://127.0.0.1:4319/ > /dev/null
